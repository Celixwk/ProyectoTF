providers = ["node"]

[phases.install]
cmds = [
    "cd backend && npm install",
    "cd backend && npm run prisma:generate"
]

[phases.build]
cmds = [
    "cd backend && npm install typescript @types/node @types/express @types/cors @types/morgan ts-node tsx --no-save",
    "cd backend && ./node_modules/.bin/tsc",
    "mkdir -p backend/dist/generated backend/dist/database",
    "cp -r backend/src/generated/* backend/dist/generated/ || true",
    "cp -r backend/src/database/* backend/dist/database/ || true"
]

[start]
cmd = "cd backend && npm start"
