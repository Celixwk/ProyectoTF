providers = ["node"]

[phases.install]
cmds = ["cd backend && npm install", "cd backend && npm run prisma:generate"]

[phases.build]
cmds = [
    "cd backend && npx tsc",
    "mkdir -p backend/dist/generated backend/dist/database",
    "cp -r backend/src/generated/* backend/dist/generated/ || true",
    "cp -r backend/src/database/* backend/dist/database/ || true"
]

[start]
cmd = "cd backend && npx prisma db push --schema=src/prisma/schema.prisma --accept-data-loss && npm start"
